#loading-screen{position:fixed;inset:0;background:#0a0e1a;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .5s}
#loading-screen.hide{opacity:0;pointer-events:none}
.loader-ring{width:44px;height:44px;border:3px solid #1e2d4a;border-top-color:#f59e0b;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:14px}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-text{font-size:12px;color:#475569;letter-spacing:.08em;font-family:'DM Sans',sans-serif}
</style>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0e1a;color:#e2e8f0;font-family:'DM Sans','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;letter-spacing:-0.005em}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#0a0e1a}::-webkit-scrollbar-thumb{background:#2a3a5c;border-radius:3px}
input,select,button{font-family:inherit;font-size:13px}
.syne{font-family:'Syne',sans-serif;letter-spacing:-0.01em}
#header{border-bottom:1px solid #1a2540;padding:20px 28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px}
#stats-row{padding:18px 28px 0;display:flex;gap:12px;flex-wrap:wrap}
#tabs{padding:18px 28px 0;display:flex;gap:8px;flex-wrap:wrap}
#content{padding:22px 28px 70px}
.card{background:#111827;border:1px solid #1e2d4a;border-radius:18px;padding:24px;margin-bottom:16px}
.card-edit{background:#0d1a2e;border:1px solid #f59e0b55;border-radius:14px;padding:18px;margin-top:10px}
.stat-card{background:#111827;border:1px solid #1e2d4a;border-radius:18px;padding:18px 22px;flex:1;min-width:130px}
.bar-track{background:#1e2d4a;border-radius:6px;height:10px;width:100%;overflow:hidden;margin-top:8px}
.bar-fill{height:100%;border-radius:6px;transition:width .5s}
input[type=text],input[type=number],input[type=date],input[type=url],select{background:#0d1526;border:1px solid #1e2d4a;border-radius:10px;color:#e2e8f0;padding:10px 13px;width:100%;outline:none;transition:border-color .2s,background .2s;font-family:inherit}
input:focus,select:focus{border-color:#f59e0b;background:#0d1a2e}
.btn{border:none;border-radius:10px;cursor:pointer;font-weight:600;padding:10px 18px;transition:all .15s;font-family:inherit;font-size:13px;letter-spacing:-0.005em}
.btn-gold{background:#f59e0b;color:#0a0e1a}.btn-gold:hover{background:#fbbf24;transform:translateY(-1px)}
.btn-lg{padding:16px 42px;font-size:15px;border-radius:14px;font-weight:600;box-shadow:0 4px 20px rgba(245,158,11,.20)}
.btn-danger{background:transparent;color:#ef4444;border:1px solid #2a3a5c;padding:6px 11px;font-weight:500}.btn-danger:hover{background:#ef444415;border-color:#ef444466}
.btn-edit{background:transparent;color:#60a5fa;border:1px solid #2a3a5c;padding:6px 11px;font-weight:500}.btn-edit:hover{background:#60a5fa15;border-color:#60a5fa66}
.btn-ghost{background:transparent;color:#475569;border:1px solid #1e2d4a}.btn-ghost:hover{border-color:#f59e0b;color:#f59e0b}
.btn-sm{padding:6px 11px;font-size:12px;font-weight:500}
.tab{padding:11px 22px;border-radius:12px;cursor:pointer;border:none;font-family:inherit;font-size:13px;font-weight:500;transition:all .15s}
.tab.active{background:#f59e0b;color:#0a0e1a;font-weight:700}
.tab:not(.active){background:transparent;color:#475569}.tab:not(.active):hover{color:#94a3b8;background:#111827}
.lbl{font-size:11px;letter-spacing:.01em;color:#475569;margin-bottom:6px;font-weight:500}
.val{font-size:24px;font-family:'Syne',sans-serif;font-weight:700;letter-spacing:-0.015em}
.row-item{border-bottom:1px solid #1a2540;padding:14px 0;display:flex;align-items:center;gap:12px}
.row-item:last-child{border-bottom:none}
.row-actions{display:flex;gap:6px;flex-shrink:0;margin-left:auto}
.chip{background:#1e2d4a;border-radius:20px;padding:4px 11px;font-size:11px;color:#94a3b8;white-space:nowrap;font-weight:500}
.stitle{font-size:13px;letter-spacing:-0.005em;color:#94a3b8;margin-bottom:16px;font-weight:600}
.risk{border-radius:12px;padding:14px 16px;margin-bottom:10px;border:1px solid;font-size:13px;line-height:1.55}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.grid4{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:12px;align-items:end}
.hidden{display:none}
.chart-wrap{margin-top:12px}
.chart-row{display:flex;align-items:center;margin-bottom:9px;gap:10px}
.chart-label{font-size:12px;color:#94a3b8;width:104px;text-align:right;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart-bar-bg{flex:1;background:#1e2d4a;border-radius:6px;height:22px;overflow:hidden}
.chart-bar-fg{height:100%;border-radius:6px;transition:width .5s;min-width:2px}
.chart-val{font-size:12px;color:#94a3b8;width:80px;flex-shrink:0}
.pill{border:1px solid #2a3a5c;border-radius:20px;padding:6px 14px;font-size:12px;cursor:pointer;background:transparent;color:#94a3b8;font-family:inherit;transition:all .15s;font-weight:500}
.pill:hover{color:#94a3b8;border-color:#3a4459}
.pill.active{border-color:#f59e0b;background:#f59e0b22;color:#f59e0b}
.star{cursor:pointer;font-size:18px;color:#2a3a5c;transition:color .1s}
.star.lit{color:#f59e0b}
.cont-card{background:#1e2d4a;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;align-items:center;min-width:92px;cursor:pointer;border:1px solid transparent;transition:all .15s;text-align:center}
.cont-card:hover{background:#1e3a5f}
.cont-card.active{border-color:#f59e0b;background:#2a3a55}
.exp-btn{background:transparent;color:#94a3b8;border:1px solid #2a3a5c;border-radius:10px;padding:8px 14px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:500;transition:all .15s}
.exp-btn:hover{border-color:#f59e0b;color:#f59e0b;background:#f59e0b11}
.doc-link{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#60a5fa;text-decoration:none;background:#60a5fa15;border:1px solid #60a5fa33;border-radius:8px;padding:4px 10px;margin-top:6px;transition:all .15s;font-weight:500}
.doc-link:hover{background:#60a5fa22;border-color:#60a5fa}
.lang-btn{background:transparent;border:1px solid #2a3a5c;border-radius:8px;padding:6px 13px;font-size:12px;cursor:pointer;font-family:inherit;color:#94a3b8;transition:all .15s;font-weight:500}
.lang-btn.active{border-color:#f59e0b;color:#f59e0b;background:#f59e0b11}
.gantt{margin-top:8px;overflow-x:auto}
.gantt-inner{min-width:560px}
.gantt-months{display:flex;margin-left:130px;margin-bottom:8px;font-size:11px;color:#475569;gap:10px;font-weight:500}
.gantt-months-track{flex:1;display:flex}
.gantt-month{flex:1;text-align:center;border-left:1px dashed #1e2d4a;padding:2px 0}
.gantt-month:first-child{border-left:none}
.gantt-row{display:flex;align-items:center;margin-bottom:6px;gap:10px}
.gantt-label{width:120px;font-size:12px;color:#94a3b8;flex-shrink:0;text-align:right;text-overflow:ellipsis;overflow:hidden;white-space:nowrap;font-weight:500}
.gantt-track{flex:1;height:24px;background:#0d1526;border-radius:8px;position:relative;border:1px solid #1e2d4a}
.gantt-bar{position:absolute;top:0;height:100%;border-radius:6px;display:flex;align-items:center;justify-content:center;padding:0 5px;font-size:10px;color:#0a0e1a;font-weight:700;white-space:nowrap;overflow:hidden}
.subtab-row{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;backdrop-filter:blur(3px)}
.modal{background:#111827;border:1px solid #1e2d4a;border-radius:18px;padding:26px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto}
.modal-title{font-family:'Syne',sans-serif;font-size:20px;font-weight:700;color:#e2e8f0;margin-bottom:5px;letter-spacing:-0.01em}
.modal-sub{font-size:13px;color:#94a3b8;margin-bottom:20px;line-height:1.5}
.modal-section-title{font-size:11px;color:#94a3b8;margin:14px 0 10px;font-weight:500;letter-spacing:.01em;text-transform:uppercase}
.csv-opt{display:flex;align-items:center;gap:11px;padding:11px 14px;border:1px solid #1e2d4a;border-radius:10px;margin-bottom:8px;cursor:pointer;transition:all .15s;background:#0d1526}
.csv-opt:hover{border-color:#2a3a5c}
.csv-opt input[type=checkbox]{cursor:pointer;width:17px;height:17px;accent-color:#f59e0b;flex-shrink:0}
.csv-opt-label{flex:1;font-size:13px;color:#e2e8f0;font-weight:500}
.csv-opt-meta{font-size:11px;color:#475569;margin-top:2px;font-weight:400}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px;flex-wrap:wrap}

</head>

<div id="header">

    <div class="syne" style="font-size:24px;font-weight:800;color:#f59e0b;letter-spacing:-0.02em">✈ Nomad Tracker</div>

  </div>
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <div style="display:flex;gap:4px">
      <button class="lang-btn active" id="btnDE" onclick="setLang('de')">DE</button>
      <button class="lang-btn" id="btnEN" onclick="setLang('en')">EN</button>
    </div>
    <button class="exp-btn" onclick="forceRecover()" title="Daten aus alten Versionen wiederherstellen">🔄 Recover</button>
    <button class="exp-btn" onclick="exportData()" title="JSON-Backup">⬇ JSON</button>
    <button class="exp-btn" onclick="openCsvDialog()" title="CSV-Export">📊 CSV</button>

    <div style="display:flex;align-items:center;gap:8px">
      <span class="lbl" style="margin-bottom:0" id="lbl-year">JAHR</span>
      <select id="yearSelect" style="width:95px" onchange="setYear(+this.value)"></select>
    </div>
  </div>
</div>
<div id="stats-row"></div>
<div id="tabs"></div>
<div id="content"></div>

function mergeArrays(current, incoming, fieldMap){
  // Merge incoming into current, skip duplicates by id
  if(!Array.isArray(incoming)||!incoming.length) return current;
  const ids=new Set(current.map(x=>String(x.id)));
  const mapped=incoming.map(x=>{
    let item={...x,id:String(x.id||uid()),docLink:x.docLink||""};
    if(fieldMap) item=fieldMap(item);
    return item;
  });
  const newItems=mapped.filter(x=>!ids.has(String(x.id)));
  return [...current,...newItems];
}

function load(){
  try{
    // Load current data first
    const cur=loadFromKey(KEY);
    if(cur) Object.assign(state,cur);

    // Always also check old keys and merge missing data
    const allOldKeys=["nomad_v3","nomad_dashboard_v2"];
    let merged=false;

    allOldKeys.forEach(oldKey=>{
      const od=loadFromKey(oldKey);
      if(!od) return;

      // Merge stays (old format: startDate/endDate → new: start/end)
      if(Array.isArray(od.stays)&&od.stays.length){
        state.stays=mergeArrays(state.stays, od.stays, s=>({
          ...s, start:s.startDate||s.start||"", end:s.endDate||s.end||""
        }));
        merged=true;
      }
      // Merge accommodations
      if(Array.isArray(od.accommodations)&&od.accommodations.length){
        state.accommodations=mergeArrays(state.accommodations, od.accommodations);
        merged=true;
      }
      // Merge flights
      if(Array.isArray(od.flights)&&od.flights.length){
        state.flights=mergeArrays(state.flights, od.flights);
        merged=true;
      }
      // Merge goals
      if(Array.isArray(od.goals)&&od.goals.length){
        state.goals=mergeArrays(state.goals, od.goals);
        merged=true;
      }
    });

    if(merged){ save(); }

  }catch(e){ console.warn("Load error",e); }

  // Safety: ensure all collections are arrays
  state.stays=Array.isArray(state.stays)?state.stays:[];
  state.accommodations=Array.isArray(state.accommodations)?state.accommodations:[];
  state.flights=Array.isArray(state.flights)?state.flights:[];
  state.goals=Array.isArray(state.goals)?state.goals:[];
  state.extras=Array.isArray(state.extras)?state.extras:[];
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
  saveToCloud().catch(()=>{});
}

function forceRecover(){
  const before={s:state.stays.length,a:state.accommodations.length,f:state.flights.length,g:state.goals.length};
  const allKeys=["nomad_v3","nomad_v2","nomad_dashboard_v2","nomad_dashboard_v1"];
  const found=[];
  allKeys.forEach(k=>{
    const od=loadFromKey(k);
    if(!od)return;
    if(Array.isArray(od.stays)&&od.stays.length)
      state.stays=mergeArrays(state.stays,od.stays,s=>({...s,start:s.startDate||s.start||"",end:s.endDate||s.end||""}));
    if(Array.isArray(od.accommodations)&&od.accommodations.length)
      state.accommodations=mergeArrays(state.accommodations,od.accommodations);
    if(Array.isArray(od.flights)&&od.flights.length)
      state.flights=mergeArrays(state.flights,od.flights);
    if(Array.isArray(od.goals)&&od.goals.length)
      state.goals=mergeArrays(state.goals,od.goals);
    found.push(k);
  });
  save();
  const after={s:state.stays.length,a:state.accommodations.length,f:state.flights.length,g:state.goals.length};
  const msg=found.length
    ?`✅ Wiederhergestellt aus: ${found.join(", ")}\n\n+${after.s-before.s} Aufenthalte, +${after.a-before.a} Unterkünfte, +${after.f-before.f} Flüge, +${after.g-before.g} Ziele\n\nGesamt: ${after.s} Aufenthalte | ${after.a} Unterkünfte | ${after.f} Flüge | ${after.g} Ziele`
    :"ℹ️ Keine weiteren alten Daten gefunden — alles ist bereits aktuell.";
  alert(msg);
  render();
}

function buildCsv(type, Y, withPrices, withNotes){
  const D=state.lang==="en"?{
    country:"Country",arrival:"Arrival",departure:"Departure",days:"Days",notes:"Notes",
    name:"Name",type:"Type",checkin:"Check-in",checkout:"Check-out",nights:"Nights",cost:"Cost (EUR)",
    from:"From",to:"To",date:"Date",airline:"Airline",flightNo:"Flight No.",
    label:"Label",amount:"Amount (EUR)",
    city:"City",continent:"Continent",priority:"Priority",status:"Status",plannedFrom:"Planned from",budgetMo:"Budget (EUR/mo)"
  }:{
    country:"Land",arrival:"Anreise",departure:"Abreise",days:"Tage",notes:"Notizen",
    name:"Name",type:"Typ",checkin:"Check-in",checkout:"Check-out",nights:"Nächte",cost:"Kosten (EUR)",
    from:"Von",to:"Nach",date:"Datum",airline:"Airline",flightNo:"Flugnummer",
    label:"Bezeichnung",amount:"Betrag (EUR)",
    city:"Stadt",continent:"Kontinent",priority:"Priorität",status:"Status",plannedFrom:"Geplant ab",budgetMo:"Budget (EUR/Monat)"
  };
  const inYear=(d,y)=>!y||(d&&new Date(d).getFullYear()===y);
  const stayInYear=(s,y)=>{
    if(!y) return true;
    if(!s.start) return false;
    const sy=new Date(s.start).getFullYear();
    const ey=s.end?new Date(s.end).getFullYear():sy;
    return sy===y||ey===y;
  };
  let rows=[];
  if(type==="stays"){
    const h=[D.country,D.arrival,D.departure,D.days];
    if(withNotes) h.push(D.notes);
    rows.push(h);
    state.stays.filter(s=>stayInYear(s,Y)).sort((a,b)=>new Date(a.start)-new Date(b.start)).forEach(s=>{
      const d=Y?daysInYear(s,Y):daysBetween(s.start,s.end);
      const r=[s.country||"",s.start||"",s.end||"",d];
      if(withNotes) r.push(s.notes||"");
      rows.push(r);
    });
  } else if(type==="accommodations"){
    const h=[D.name,D.country,D.type,D.checkin,D.checkout,D.nights];
    if(withPrices) h.push(D.cost);
    if(withNotes) h.push(D.notes);
    rows.push(h);
    state.accommodations.filter(a=>inYear(a.checkIn,Y)).sort((a,b)=>new Date(a.checkIn)-new Date(b.checkIn)).forEach(a=>{
      const nights=a.checkIn&&a.checkOut?Math.max(0,daysBetween(a.checkIn,a.checkOut)-1):"";
      const r=[a.name||"",a.country||"",a.type||"",a.checkIn||"",a.checkOut||"",nights];
      if(withPrices) r.push(a.cost||"");
      if(withNotes) r.push(a.notes||"");
      rows.push(r);
    });
  } else if(type==="flights"){
    const h=[D.from,D.to,D.date,D.airline,D.flightNo];
    if(withPrices) h.push(D.cost);
    if(withNotes) h.push(D.notes);
    rows.push(h);
    state.flights.filter(f=>inYear(f.date,Y)).sort((a,b)=>new Date(a.date)-new Date(b.date)).forEach(f=>{
      const r=[f.from||"",f.to||"",f.date||"",f.airline||"",f.flightNo||""];
      if(withPrices) r.push(f.cost||"");
      if(withNotes) r.push(f.notes||"");
      rows.push(r);
    });
  } else if(type==="extras"){
    const h=[D.label,D.date,D.country];
    if(withPrices) h.push(D.amount);
    if(withNotes) h.push(D.notes);
    rows.push(h);
    state.extras.filter(e=>inYear(e.date,Y)).sort((a,b)=>new Date(a.date)-new Date(b.date)).forEach(e=>{
      const r=[e.label||"",e.date||"",e.country||""];
      if(withPrices) r.push(e.amount||"");
      if(withNotes) r.push(e.notes||"");
      rows.push(r);
    });
  } else if(type==="goals"){
    const h=[D.country,D.city,D.continent,D.priority,D.status,D.plannedFrom];
    if(withPrices) h.push(D.budgetMo);
    if(withNotes) h.push(D.notes);
    rows.push(h);
    state.goals.forEach(g=>{
      const r=[g.country||"",g.city||"",g.continent||"",g.priority||"",g.status||"",g.planDate||""];
      if(withPrices) r.push(g.budgetEst||"");
      if(withNotes) r.push(g.notes||"");
      rows.push(r);
    });
  }
  return toCsv(rows);
}
function toCsv(rows){
  const esc=v=>{
    if(v==null) return "";
    const s=String(v);
    if(/[";\n\r]/.test(s)) return '"'+s.replace(/"/g,'""')+'"';
    return s;
  };
  return rows.map(r=>r.map(esc).join(";")).join("\r\n");
}
function downloadCsv(csv, filename){
  const blob=new Blob(["﻿"+csv], {type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
function csvFilename(type, Y){
  const map=state.lang==="en"
    ? {stays:"stays",accommodations:"accommodations",flights:"flights",extras:"other-costs",goals:"wishlist"}
    : {stays:"aufenthalte",accommodations:"unterkuenfte",flights:"fluege",extras:"sonstige-kosten",goals:"wunschliste"};
  return `nomad-${map[type]||type}${Y?"-"+Y:"-alle"}.csv`;

function daysPerCountry(year){
  const m={};
  state.stays.forEach(s=>{
    if(!s.country||!s.start||!s.end)return;
    const cur=new Date(s.start),end=new Date(s.end);
    while(cur<=end){if(cur.getFullYear()===year)m[s.country]=(m[s.country]||0)+1;cur.setDate(cur.getDate()+1);}
  });
  return m;
}
function maxConsec(country,year){
  const dates=new Set();
  state.stays.forEach(s=>{
    if(s.country!==country)return;
    const cur=new Date(s.start),end=new Date(s.end);
    while(cur<=end){if(cur.getFullYear()===year)dates.add(cur.toISOString().slice(0,10));cur.setDate(cur.getDate()+1);}
  });
  const arr=[...dates].sort();let max=0,cur=0;
  arr.forEach((d,i)=>{cur=i===0?1:(new Date(d)-new Date(arr[i-1]))/86400000===1?cur+1:1;max=Math.max(max,cur);});
  return max;
}
function getYears(){
  const s=new Set([new Date().getFullYear()]);
  state.stays.forEach(x=>{
    if(x.start) s.add(new Date(x.start).getFullYear());
    if(x.end)   s.add(new Date(x.end).getFullYear());
  });
  state.accommodations.forEach(x=>x.checkIn&&s.add(new Date(x.checkIn).getFullYear()));
  state.flights.forEach(x=>x.date&&s.add(new Date(x.date).getFullYear()));
  state.extras.forEach(x=>x.date&&s.add(new Date(x.date).getFullYear()));
  return [...s].sort((a,b)=>b-a);
}

  return`<div class="chart-wrap">${items.slice(0,15).map(i=>{const pct=Math.round(i.v/max*100);return`<div class="chart-row"><div class="chart-label" title="${i.k}">${i.k}</div><div class="chart-bar-bg"><div class="chart-bar-fg" style="width:${Math.max(pct,1)}%;background:${i.c||color}"></div></div><div class="chart-val">${i.label||i.v}</div></div>`;}).join("")}</div>`;

function docLinkHtml(url){

}
function numInput(id,value,placeholder,step){
  const has=value!==undefined&&value!==null&&value!=="";
  const valAttr=has?` value="${String(value).replace(/"/g,"&quot;")}"`:"";
  const phAttr=placeholder?` placeholder="${String(placeholder).replace(/"/g,"&quot;")}"`:"";
  const stAttr=step?` step="${step}"`:"";
  return `<input type="number" id="${id}" inputmode="decimal"${valAttr}${phAttr}${stAttr}>`;
}

// ── RENDER ────────────────────────────────────────────────────────────────
function render(){
  const Y=state.year;
  const dm=daysPerCountry(Y);
  const accY=state.accommodations.filter(a=>a.checkIn&&new Date(a.checkIn).getFullYear()===Y);
  const flyY=state.flights.filter(f=>{ if(!f.date)return false; const yr=new Date(f.date).getFullYear(); return !isNaN(yr)&&yr===Y; });
  const extrY=state.extras.filter(e=>{ if(!e.date)return false; const yr=new Date(e.date).getFullYear(); return !isNaN(yr)&&yr===Y; });
  const accTot=accY.reduce((s,a)=>s+(+a.cost||0),0);
  const flyTot=flyY.reduce((s,f)=>s+(+f.cost||0),0);
  const othTot=extrY.reduce((s,e)=>s+(+e.amount||0),0);
  document.getElementById("tagline").textContent=t("tagline");
  document.getElementById("lbl-year").textContent=t("year");
  const ys=getYears();
  document.getElementById("yearSelect").innerHTML=ys.map(y=>`<option value="${y}"${y===Y?" selected":""}>${y}</option>`).join("");
  document.getElementById("stats-row").innerHTML=[
    {l:`${t("countries")} ${Y}`,v:Object.keys(dm).length,c:"#60a5fa"},
    {l:`${t("travelDays")} ${Y}`,v:Object.values(dm).reduce((a,b)=>a+b,0),c:"#f59e0b"},
    {l:`${t("accommodation")} ${Y}`,v:fmtEur(accTot),c:"#a78bfa",sm:true},
    {l:`${t("flights")} ${Y}`,v:fmtEur(flyTot),c:"#34d399",sm:true},
    {l:`${t("other")} ${Y}`,v:fmtEur(othTot),c:"#fb923c",sm:true},
    {l:`${t("total")} ${Y}`,v:fmtEur(accTot+flyTot+othTot),c:"#e2e8f0",sm:true},
  ].map(s=>`<div class="stat-card"><div class="lbl">${s.l}</div><div class="val" style="color:${s.c};font-size:${s.sm?"17px":"23px"}">${s.v}</div></div>`).join("");
  document.getElementById("tabs").innerHTML=t("tabs").map((tb,i)=>`<button class="tab${state.tab===i?" active":""}" onclick="setTab(${i})">${tb}</button>`).join("");
  const c=document.getElementById("content");
  switch(state.tab){
    case 0:c.innerHTML=renderCountries(dm,Y);break;
    case 1:c.innerHTML=renderAccom(accY,extrY,Y);break;
    case 2:c.innerHTML=renderFlights(flyY,Y);break;
    case 3:c.innerHTML=renderGoals();break;
    case 4:c.innerHTML=renderBudget(accY,flyY,extrY,dm,Y);break;
  }
}

      <div style="text-align:right"><button class="btn btn-gold" onclick="addStay()">${t("save")}</button></div>

function daysInYear(s, year){
  if(!s.start||!s.end) return 0;
  const cur=new Date(s.start), end=new Date(s.end);
  let count=0;
  const c=new Date(cur);
  while(c<=end){ if(c.getFullYear()===year) count++; c.setDate(c.getDate()+1); }
  return count;
}

function stayRow(s){
  const isEdit=String(editing.stays)===String(s.id);
  const totalDays=daysBetween(s.start,s.end);
  const startY=s.start?new Date(s.start).getFullYear():null;
  const endY=s.end?new Date(s.end).getFullYear():null;
  const spansYears=startY&&endY&&startY!==endY;

  // Build year-split badge
  let daysBadge="";
  if(spansYears){
    const years=[];
    for(let y=startY;y<=endY;y++){
      const d=daysInYear(s,y);
      if(d>0) years.push(`<span style="background:#2a3a55;border:1px solid #2a4a7f;border-radius:20px;padding:2px 8px;font-size:10px;color:#94a3b8;margin-left:4px">${d}T in ${y}</span>`);
    }
    daysBadge=`<span class="chip" style="margin-left:8px">${totalDays} ${t("days")} gesamt</span>${years.join("")}`;
  } else {
    daysBadge=`<span class="chip" style="margin-left:8px">${totalDays} ${t("days")}</span>`;
  }
  let html=`<div class="row-item">
    <div style="flex:1">

      <span style="color:#475569;font-size:11px;margin-left:10px">${fmtDate(s.start)} → ${fmtDate(s.end)}</span>
      ${daysBadge}
      ${s.notes?`<div style="font-size:11px;color:#64748b;margin-top:3px">${s.notes}</div>`:""}
    </div>
    <div class="row-actions">
      <button class="btn btn-edit btn-sm" onclick="toggleEdit('stays','${s.id}')">${isEdit?t("cancel"):t("edit")}</button>
      <button class="btn btn-danger" onclick="del('stays','${s.id}')">✕</button>
    </div>
  </div>`;
  if(isEdit){
    html+=`<div class="card-edit">

        <div><div class="lbl">${t("country")}</div><select id="es_c">${countryOpts(s.country)}</select></div>

// ── TAB 4: BUDGET & STEUER ────────────────────────────────────────────────
function renderBudget(accY,flyY,extrY,dm,Y){
  const accTot=accY.reduce((s,a)=>s+(+a.cost||0),0);
  const flyTot=flyY.reduce((s,f)=>s+(+f.cost||0),0);
  const othTot=extrY.reduce((s,e)=>s+(+e.amount||0),0);
  const grand=accTot+flyTot+othTot;
  const months=Array.from({length:12},(_,i)=>({name:new Date(Y,i).toLocaleDateString("de-DE",{month:"short"}),acc:0,fly:0,oth:0}));
  accY.forEach(a=>{if(a.checkIn)months[new Date(a.checkIn).getMonth()].acc+=(+a.cost||0);});
  flyY.forEach(f=>{if(f.date)months[new Date(f.date).getMonth()].fly+=(+f.cost||0);});
  extrY.forEach(e=>{if(e.date)months[new Date(e.date).getMonth()].oth+=(+e.amount||0);});
  const monthMax=Math.max(...months.map(m=>m.acc+m.fly+m.oth),1);
  const R=t("riskMsgs");
  const risks=[];
  Object.entries(dm).forEach(([country,days])=>{
    if(days>=LIMIT)risks.push({l:"critical",m:R.over183.replace("LAND",country).replace("DAYS",days)});
    else if(days>=150)risks.push({l:"warn",m:R.near150.replace("LAND",country).replace("DAYS",days).replace("REST",LIMIT-days)});
    else if(days>=90)risks.push({l:"caution",m:R.over90.replace("LAND",country).replace("DAYS",days)});
  });
  const deKey=Object.keys(dm).find(k=>k==="Deutschland"||k==="Germany");
  const deD=deKey?maxConsec(deKey,Y):0;
  if(deD>=183)risks.push({l:"critical",m:R.deConsecHigh.replace("DAYS",deD)});
  else if(deD>=DE_WARN)risks.push({l:"warn",m:R.deConsecWarn.replace("DAYS",deD)});
  const n=Object.keys(dm).length;
  if(n>=4)risks.push({l:"ok",m:R.manyCountries.replace("COUNT",n)});
  else if(n>=2)risks.push({l:"caution",m:R.fewCountries.replace("COUNT",n)});
  const maxD=Math.max(...Object.values(dm),0);
  if(maxD>0&&maxD<90)risks.push({l:"ok",m:R.cleanProfile});
  if(risks.length===0)risks.push({l:"ok",m:R.noRisk});
  const LS={critical:{bg:"#ef444415",border:"#ef4444",color:"#ef4444"},warn:{bg:"#f9731615",border:"#f97316",color:"#f97316"},caution:{bg:"#eab30815",border:"#eab308",color:"#eab308"},ok:{bg:"#22c55e15",border:"#22c55e",color:"#22c55e"}};
  let html=`<div class="card">
    <div class="stitle">${t("totalBudget")} ${Y}</div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px">
      <div style="flex:1;min-width:110px;text-align:center;background:#0d1526;border-radius:10px;padding:14px">
        <div class="lbl">${t("accommodation")}</div>
        <div class="syne" style="font-size:20px;font-weight:700;color:#a78bfa">${fmtEur(accTot)}</div>
        <div style="font-size:11px;color:#475569;margin-top:4px">${grand>0?Math.round(accTot/grand*100):0}${t("pctOfTotal")}</div>
      </div>
      <div style="flex:1;min-width:110px;text-align:center;background:#0d1526;border-radius:10px;padding:14px">
        <div class="lbl">${t("flights")}</div>
        <div class="syne" style="font-size:20px;font-weight:700;color:#34d399">${fmtEur(flyTot)}</div>
        <div style="font-size:11px;color:#475569;margin-top:4px">${grand>0?Math.round(flyTot/grand*100):0}${t("pctOfTotal")}</div>
      </div>
      <div style="flex:1;min-width:110px;text-align:center;background:#0d1526;border-radius:10px;padding:14px">
        <div class="lbl">${t("other")}</div>
        <div class="syne" style="font-size:20px;font-weight:700;color:#fb923c">${fmtEur(othTot)}</div>
        <div style="font-size:11px;color:#475569;margin-top:4px">${grand>0?Math.round(othTot/grand*100):0}${t("pctOfTotal")}</div>
      </div>
      <div style="flex:1;min-width:110px;text-align:center;background:#0d1526;border-radius:10px;padding:14px;border:1px solid #f59e0b33">
        <div class="lbl">${t("total")}</div>
        <div class="syne" style="font-size:20px;font-weight:700;color:#f59e0b">${fmtEur(grand)}</div>
        <div style="font-size:11px;color:#475569;margin-top:4px">Ø ${fmtEur(grand/12)}${t("perMonth")}</div>
      </div>
    </div>
    <div class="stitle">${t("monthlyExpenses")} ${Y}</div>
    ${months.map(m=>{
      const tot=m.acc+m.fly+m.oth;
      const ap=Math.round(m.acc/monthMax*100), fp=Math.round(m.fly/monthMax*100), op=Math.round(m.oth/monthMax*100);
      const segs=[
        m.acc?`<div style="width:${ap}%;background:#a78bfa;min-width:2px"></div>`:"",
        m.fly?`<div style="width:${fp}%;background:#34d399;min-width:2px"></div>`:"",
        m.oth?`<div style="width:${op}%;background:#fb923c;min-width:2px"></div>`:""
      ].join("");
      return `<div class="chart-row"><div class="chart-label">${m.name}</div><div class="chart-bar-bg"><div style="height:100%;display:flex;border-radius:4px;overflow:hidden">${segs}</div></div><div class="chart-val">${tot>0?fmtEur(tot):""}</div></div>`;
    }).join("")}
    <div style="display:flex;gap:16px;margin-top:10px;flex-wrap:wrap">
      <span style="font-size:11px;color:#a78bfa">■ ${t("accommodation")}</span>
      <span style="font-size:11px;color:#34d399">■ ${t("flights")}</span>
      <span style="font-size:11px;color:#fb923c">■ ${t("other")}</span>
    </div>
  </div>
  <div class="card">
    <div class="stitle">🛡 ${t("riskCheck")} ${Y}</div>
    <div style="font-size:11px;color:#475569;margin-bottom:14px;line-height:1.6">${t("riskDisclaimer")}</div>
    ${risks.map(r=>{const s=LS[r.l];return`<div class="risk" style="background:${s.bg};border-color:${s.border};color:${s.color}">${r.m}</div>`;}).join("")}
    ${Object.keys(dm).length?`<div style="margin-top:18px"><div class="stitle">${t("statusBarTitle")}</div>
    ${Object.entries(dm).sort((a,b)=>b[1]-a[1]).map(([c,d])=>{const pct=Math.min(100,d/LIMIT*100),col=clr(d/LIMIT);return`<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span>${c}</span><span style="color:${col}">${d} / ${LIMIT} ${t("days")} (${Math.round(pct)}%)</span></div><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${col}"></div></div></div>`;}).join("")}
    </div>`:""}
    <div style="margin-top:18px;background:#0d1526;border-radius:10px;padding:14px;font-size:11px;color:#475569;line-height:1.9">
      <div style="color:#94a3b8;margin-bottom:6px;letter-spacing:.05em">${t("rulesTitle")}</div>
      ${t("rules").map(r=>`<div>• ${r}</div>`).join("")}
    </div>
  </div>`;
  return html;
}

// ── GANTT TIMELINE ────────────────────────────────────────────────────────
function gantt(yearStays,Y){
  if(!yearStays.length) return "";
  const locale=state.lang==="en"?"en-US":"de-DE";
  const months=Array.from({length:12},(_,i)=>new Date(Y,i,1).toLocaleDateString(locale,{month:"short"}));
  const yearStart=new Date(Y,0,1).getTime();
  const yearEnd=new Date(Y,11,31,23,59,59,999).getTime();
  const yearMs=yearEnd-yearStart;
  const dm=daysPerCountry(Y);
  // Group by country, keep chronological order by first stay
  const byCountry={};
  yearStays.forEach(s=>{(byCountry[s.country]=byCountry[s.country]||[]).push(s);});
  const countries=Object.keys(byCountry).sort((a,b)=>{
    const fa=Math.min(...byCountry[a].map(s=>new Date(s.start).getTime()));
    const fb=Math.min(...byCountry[b].map(s=>new Date(s.start).getTime()));
    return fa-fb;
  });
  const rows=countries.map(country=>{
    const col=clr((dm[country]||0)/LIMIT);
    const bars=byCountry[country].map(s=>{
      const sMs=new Date(s.start).getTime(), eMs=new Date(s.end||s.start).getTime();
      const start=Math.max(yearStart,sMs), end=Math.min(yearEnd,eMs);
      if(end<yearStart||start>yearEnd) return "";
      const left=(start-yearStart)/yearMs*100;
      const width=Math.max(0.4,(end-start)/yearMs*100);
      const days=Math.round((end-start)/86400000)+1;
      const lbl=width>4?days+"T":"";
      return `<div class="gantt-bar" style="left:${left}%;width:${width}%;background:${col}" title="${country}: ${fmtDate(s.start)} → ${fmtDate(s.end)} (${days} ${t("days")})">${lbl}</div>`;
    }).join("");
    return `<div class="gantt-row">
      <div class="gantt-label" title="${country}">${country}</div>
      <div class="gantt-track">${bars}</div>
    </div>`;
  }).join("");
  const monthHeader=`<div class="gantt-months"><div class="gantt-months-track">${months.map(m=>`<div class="gantt-month">${m}</div>`).join("")}</div></div>`;
  return `<div class="gantt"><div class="gantt-inner">${monthHeader}${rows}</div></div>`;
}

function addFlight(){

  render();

  state.extras.push({id:uid(), label:lbl, date:today(), amount:amt, country:v("ox_c"), notes:v("ox_n"), docLink:v("ox_link")});

}

function saveEdit(list,id){
  const item=state[list].find(x=>String(x.id)===String(id));
  if(!item)return;
  if(list==="stays"){
    item.country=v("es_c");item.start=v("es_s");item.end=v("es_e");item.notes=v("es_n");
  } else if(list==="accommodations"){
    item.name=v("ea_n");item.country=v("ea_c");item.type=v("ea_t");
    item.checkIn=v("ea_ci");item.checkOut=v("ea_co");item.cost=v("ea_cost");
    item.notes=v("ea_notes");item.docLink=v("ea_link");
  } else if(list==="flights"){
    item.from=v("ef_from");item.to=v("ef_to");item.date=v("ef_date");
    item.airline=v("ef_air");item.flightNo=v("ef_fn");item.cost=v("ef_cost");
    item.notes=v("ef_notes");item.docLink=v("ef_link");
  } else if(list==="goals"){
    item.country=v("eg_c");item.city=v("eg_ci");item.continent=v("eg_ct");
    item.priority=v("eg_p");item.status=v("eg_s");item.planDate=v("eg_d");
    item.budgetEst=v("eg_b");item.notes=v("eg_n");item.docLink=v("eg_l");
  } else if(list==="extras"){
    item.label=v("ex_l");item.amount=v("ex_a");
    item.country=v("ex_c");item.notes=v("ex_n");item.docLink=v("ex_link");
  }
  editing[list]=null;
  save();render();
}

function del(list,id){
  state[list]=state[list].filter(x=>String(x.id)!==String(id));

}

      Object.assign(state, DEFAULT_DATA);
      save();
    }

    // Offline fallback

    if(local) Object.assign(state, local);

  }
  if(loading){ loading.classList.add("hide"); setTimeout(()=>loading.remove(),500); }

})();
